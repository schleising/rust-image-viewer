[package]
name = "image-viewer"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["Steve"]
description = "Browse, view, and edit images and videos"

[dependencies]
dioxus = { version = "0.8.0-alpha.3", features = ["desktop"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
image-webp = "0.2"
fast_image_resize = "5"
tracing = "0.1"
tracing-subscriber = "0.3"
file-rotate = "0.8"
chrono = "0.4"
objc2 = "0.6"
dispatch2 = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync"] }
tract-onnx = "0.22"

[dev-dependencies]
gif = "0.13"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
